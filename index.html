<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>신경과 랜덤 Post-test 퀴즈</title>
  <link rel="manifest" href="manifest.json?v=5">
  <meta name="theme-color" content="#4CAF50">
  <style>
    body { font-family: Arial, sans-serif; max-width:800px; margin:20px auto; padding:16px; text-align:center; }
    header { display:flex; justify-content:space-between; align-items:center; gap:12px; }
    h1 { margin:0; font-size:1.25rem; }
    #status { color:#666; font-size:0.95rem; margin-top:8px; text-align:left; }
    .question { margin:20px 0; font-size:1.15rem; white-space:pre-line; text-align:left; }
    .answer { margin-top:10px; font-weight:600; color:#0a6; white-space:pre-line; display:none; text-align:left; }
    .controls { margin-top:18px; }
    button { padding:10px 14px; margin:6px; font-size:1rem; }
    .progress-wrap { margin-top:14px; text-align:left; }
    .progress-info { font-size:0.92rem; color:#444; margin-bottom:6px; }
    .progress-bar { width:100%; height:12px; background:#eee; border-radius:8px; overflow:hidden; }
    .progress-inner { height:100%; width:0%; background:#4caf50; transition: width 0.25s ease; }
    small.note { display:block; color:#888; margin-top:8px; text-align:left; }
  </style>
</head>
<body>
  <header>
    <h1>신경과 랜덤 Post-test 퀴즈</h1>
    <div>
      <button id="btnToggleMode">복습 모드로</button>
      <button id="btnReset">초기화</button>
    </div>
  </header>

  <div id="status" aria-live="polite">로딩 중...</div>

  <div class="question" id="question">문제가 여기에 표시됩니다.</div>
  <div class="answer" id="answer"></div>

  <div class="controls" id="controls">
    <button id="btnShowAnswer">정답 보기</button>
    <button id="btnMarkWrong">오답 저장</button>
    <button id="btnPrev">이전 문제</button>
    <button id="btnNext">다음 문제</button>
    <!-- 복습 모드에서 첫 문제로 돌아가기 버튼 -->
    <button id="btnRestartReview" style="display:none;">복습 첫 문제로</button>
    <!-- 복습 모드에서 오답 제거 버튼 -->
    <button id="btnRemoveWrong" style="display:none;">오답 제거</button>
  </div>

  <div class="progress-wrap">
    <div class="progress-info" id="progressInfo">진행: 0 / 0 (남음: 0)</div>
    <div class="progress-bar"><div id="progressInner" class="progress-inner"></div></div>
    <small class="note">※ 정답 보기 버튼은 정답만 보여줍니다. 다음 문제로 이동하려면 '다음 문제' 버튼을 누르세요.</small>
  </div>

<script>
  // 기존 문제 데이터
  const questions = [
    { q: "*종종 변형되는 문제입니다. <br>62세 오른손잡이 남자 환자가 Rt. side weakness를 주소 응급실에 내원하였다. 가지고 있는 과거력으로는 HTN, DM, Hyperlipidemia가 있었으며, 50갑년의 흡연력을 가지고 있다. <br>내원 후 시행한 EKG에서 A. fib이 확인되었다. 환자는 증상 발생 후 1시간 이내 본원 응급실로 내원하였다.<br>내원 당시 시행한 신경학적 진찰 상 mental status는 alert 하였으며 moderate dysarthric speech를 보이고 있었다. Language function test 했을 때 묻는 말을 이해할 수 있었으며 의미있는 문장을 구사할 수 없었고, 따라 하기와 이름대기는 불가능하였다. <br>Cranial nerve function test 했을 때 환자의 pupil size 및 light reflex는 정상이었으나 양안 모두 왼쪽으로 치우쳐지려는 경향 보였고, 오른쪽 입고리가 쳐져 있는 모습 보였다. <br>환자의 고개 또한 왼쪽으로 틀어져 있었다. 또한 Nex. 했을 때 Gerstmann syndrome이 보였다.<br>사지 근력을 측정했을 때, 오른쪽 상하지 모두 중력에 대해서는 겨우 들 수 있었다. 통증을 주었을 때 오른쪽 상하지 감각 저하 소견 보였다. 오른쪽 Babinski sign 양성으로 확인 되었다. <br>환자분은 NIHSS 12점으로 측정되었으며, 최근 3주 이내 수술한 기왕력 및 기타 출혈 경향성 등은 모두 정상적이었고, 응급실 내원 후 시행한 lab에서도 큰 이상 보이지 않았다. <br>혈압과 혈당 등 vital sign 모두 정상이었고, initial brain CT 상 hemorrhage 및 hypodense lesion이 없는 것을 확인하였으며, next step으로 촬영한 CT angio perfusion 영상에서 penumbra가 확인 되었다.<br>다음 물음에 답하시오.<br>1. 위 환자의 신경학적 진찰 상 보이는 aphasia의 유형을 쓰시오.<br>2. 위 환자 신경학적 진찰 상 오른쪽 상하지 motor grade 쓰시오.<br>3. 위 환자의 예상되는 진단명을 아는 대로 쓰고, Willis circle에서 문제가 있을 수 있는 혈관들을 아는대로 쓰시고, 내원 후 진행할 수 있는 치료 flow를 아는대로 쓰시오. 이때 제일 중요한 치료법 하나는 꼭 포함할 것.", a: "1. Broca’s aphasia<br><img src='1.png' style='max-width:600px;'><br>2. Grade 3<br><img src='2.png' style='max-width:600px;'><br>3. 진단명: Lt. MCA infarction, Lt. ICA infarction<br>문제되는 혈관: Lt. MCA, Lt, ICA<br>치료: 급성기 치료로 tPA, Intra-arterial thrombectomy를 하고 2차 예방을 위해 anticoagulant를 쓸 수 있다." },
    { q: "Gerstmann syndrome의 4가지 증상들을 쓰고, 병변의 위치를 쓰시오.", a: "Agraphia or dysgraphia<br>Acalculia or dyscalculia<br>Finger agnosia<br>Left Right disorientation<br>병변 위치: Dominant parietal lobe" },
    { q: "54세 남자환자가 dizziness를 주소로 증상 발생 후 3시간만에 응급실로 내원하였다. 환자는 HTN으로 진단받아 med. 복용하고 있었으며 20갑년의 흡연력이 있었다.<br>신경학적 진찰 상 ipsipulsion과 nystagmus가 있었으며, Rt. side V1-3 region에 감각 저하 및 동측 Horner syndrome 확인되었다. <br>환자는 말할 때 쉰목소리가 나온다고 했으며, 응급실 내원 후 약을 먹기 위해 물을 마실 때 심하게 사래에 걸렸다. <br>또한 가만히 앉아있어도 오른쪽으로 기우는 증상이 발생했으며, Rt. side severe dysmetria 관찰되었다. 또한 점점 왼쪽 상하지 온도, 통증 감각이 저하되는 것 같다고 했다. <br>현재 환자의 신경학적 진찰을 토대로 가장 가능성 있는 진단명을 쓰고, 어떤 혈관에 문제가 생겼을 지 쓰시오.", a: "진단명: Rt. Lateral medullary syndrome<br>혈관: Rt. PICA(posterior inferior cerebellar artery)" },
    { q: "73세 남자가 2시간 전에 발생한 dizziness를 주소로 본원 응급실 내원하였다. 과거력으로는 HTN, 20갑년의 흡연력 있었으며, 이전에 Acute infarction in Lt. subcortex로 진단받아 본원 신경과 입원치료 받은 적 있었다. <br>환자분 신경학적 진찰을 했을 때 아래와 같은 안구 움직임이 관찰되었다. 해당 안구 움직임을 나타낼 수 있는 질환명을 쓰고 병터를 아래 그림에서 고르시오.<br><img src='3.png' style='max-width:600px;'><br><img src='4.png' style='max-width:600px;'>", a: "질환명: Lt. internuclear opthalmoplegia<br>병터: 병터 4" },
    { q: "56세 여자환자가 갑자기 발생한 어지럼증을 주소로 내원하였다. 증상은 자세에 따라 변화가 없었고, 수 시간 동안 지속되었다. 동반된 증상으로 오심, 구토가 있었다. <br>살면서 이런 어지러움은 처음이라고 하였다. 4일 전에 감기 기운이 있어서 근처 내과에서 약을 타 먹었던 적이 있었다고 했다. <br>신경학적 진찰 시, right로 수평성분 nystagmus가 all position에서 관찰되었으며, Alexander’s law를 만족하였다. 그 밖에 청력저하 등 ear symptom은 없었다. <br>이 환자에서 가장 의심되는 진단명 한 개를 쓰고 감별해야 하는 질환 두 가지를 쓰시오. 또 해당 진단명일 때 꼭 시행해봐야 하는 neurology를 쓰시오.", a: "진단명: Lt. vestibular neuritis<br>감별질환: BPPV, Meniere disease<br>Neurology: HINTS(head impulse test, gaze evoked nystagmus, test for skew deviation)" },
    { q: "응급실에 36세 남자가 양측 하지 위약감을 내원하였다. 특이 과거력 진단받은 적은 없으나, 4일 전에 혼자 야식으로 치킨을 먹은 후 배탈이 난 적이 있었다고 했다. <br>배탈 난 후 양쪽 다리가 무거운듯한 느낌이 있었으나 특별히 거동 문제는 없었다고 했다. 현재는 하지 위약감 증상이 점점 악화되어 응급실로 내원하였다.<br>응급실 내원 당시 신경학적 진찰 상 facial palsy 있었으며 bilateral lower extremity grade 4로 측정되었다. 환자분 현재 양측 다리에 paresthesia도 동반되고 있다고 했다.<br>DTR 시행했을 때 양측 knee jerk에서 DTR 보이지 않았다. 다음 물음에 답하시오.<br>1. 상기 환자 신경학적 진찰 상 가장 의심되는 질환명을 쓰고, 해당 진단명의 진단기준을 아는 대로 쓰시오.<br>2. 위 질환명을 의심했을 때 시행해야 하는 검사와 특징적인 검사 소견을 쓰시오.", a: "질환명: Guillain-Barre syndrome<br>진단기준: 사진 참조<br><img src='5.png' style='max-width:600px;'><br>시행검사: NCS, CSF<br>검사 소견: NCS: demyelination 소견, CSF: albuminocytologic dissociation" },
    { q: "57세 여자가 headache를 주소로 신경과 외래에 내원하였다. 환자가 호소하는 두통은 일주일 중 거의 5일 동안 발생하였으며, 심할 때는 하루 종일 아프기도 한다고 했다. <br>심할 때 약을 먹으면 조금 호전되기도 하지만 다시 악화된다고 했다.<br>주로 왼쪽 fronto-temporal area에 통증이 있었으며 심장박동 주기처럼 박동성의 욱씬거리는 통증이 있었다. 통증 위치는 여기 저기 돌아다니기도 한다. <br>가장 심할 때 통증강도는 VAS 7-8점 정도이다. 통증이 너무 심할 때는 아무 일도 할 수 없을 정도여서 누워만 있을 정도라고 했다. <br>특히나 큰 소리가 나거나 밝은 빛을 보면 더 심해져서 문을 다 닫고 커튼도 쳐놓고 가만히 누워 있어야 한다고 했다. <br>두통 시작 전에 눈앞에 어른거리는 증상이나 번쩍거림은 없었다고 한다. 다음 물음에 답하시오.<br>위 환자의 진단명을 쓰시고, 치료법을 아는 대로 쓰시오.", a: "진단명: 편두통<br>치료법: triptan과 에르고트로 치료하고, propranolol과 같은 베타차단제를 예방치료에 이용할 수 있습니다." },
    { q: "Sensory aphasia를 보이는 환자에서 시행할 수 있는 language function test는?", a: "Fluency, comprehension, repetition" },
    { q: "문제가 생겼을 때 Sensory aphasia가 발생하는 영역과 cerebral artery를 쓰시오.", a: "Wernicke's area, inferior branch of lt. MCA" },
    { q: "편두통 환자에게 할 수 있는 급성 및 예방 치료를 각각 1개 이상 쓰시오.", a: "급성기: triptan, ergotamine <br>예방: 베타차단제(propranolol)" },
    { q: "사진상의 환자에서 보이는 N/ex를 2가지 쓰시오.<br><img src='7.png' style='max-width:600px;'>", a: "종양 등에 의한 뒤쪽 척수 압박시 N/Ex <br>진동감각 소실(tuning fork), 관절 위치감각 소실(proprioception), Romberg test 양성, 감각성 실조(sensory ataxia), stamping gait, 미세촉각 저하(2-point discrimination 장애), 통증·온도감각은 보존(anterolateral system 정상)" },
    { q: "??세 남자 전날 밤까지 증상 없었고, 8:00에 화장실 갈 때 증상 없었고, 8:30에 아침을 먹다가 오른팔에 힘이 없어서 9:00경 응급실에 내원하였다. <br>EKG 상 A-fib이 있었다. 약물 복용력과 질환력은 없다. <br>이 환자에게 시행할 수 있는 검사 혹은 치료를 1가지만 쓰시오.", a: "IV-tPA" },
    { q: "TOAST를 5가지 쓰시오", a: "Large artery atherosclerosis, Cardioembolism, Small vessel occlusion, Stroke of Other determined Etiology, Stroke of undetermined etiology" },
    { q: "Right VN 환자에게 보일 수 있는 N/ex를 3가지 쓰시오.", a: "HIT(+), GEN(-), skew deviation(-)" },
    { q: "의식이 없는 환자에게 할 수 있는 N/ex를 5가지 쓰고, 간단히 설명하시오.", a: "light reflex : CN 2->3 이 관여하는 반사로, 동공에 빛을 쏘이면 양안의 동공수축이 발생해야 정상입니다. <br>gag reflex : CN 9, 10이 관여하는 반사로, 설압자로 혀 뒤쪽을 누르면 발생해야 정상입니다. <br>head impulse test : VOR, 전정기능을 평가하는 검사로 환자의 머리를 한쪽으로 빠르게 돌렸을 때 눈이 머리방향을 따라가지 않고 앞을 볼 수 있어야 정상입니다. 이상이 있는 경우 catch-up saccade가 나타납니다. <br>oculocephalic reflex(doll’s eye reflex) : 환자의 머리를 옆으로 돌렸을 때 눈이 머리를 따라 움직이지 않고 정면을 향해 있을 수 있어야 정상입니다. <br>병적 반사 : babinski sign, hoffmann sign 등" },
    { q: "중증근무력증을 진단할 수 있는 검사를 2가지 이상 쓰시오.", a: "RNS test, Tensilon test, Single-fiber EMG, Serology(Ab test)" },
    { q: "Myelopathy와 radiculopathy의 차이 및 구분할 수 있는 방법을 자유롭게 기술하시오.", a: "<img src='8.png' style='max-width:600px;'>" },
    { q: "TOAST classification 중 가장 가능성이 높은 것을 쓰고, Novel or non-vitamin K-dependent antagonist oral anticoagulation(NOAC)의 종류 4가지를 쓰시오.", a: "Cardioembolism <br>Dabigatran, Edoxaban, Rivaroxaban, Apixaban" },
    { q: "뇌졸중의 위험인자 중 교정가능한 인자를 아는대로 쓰시오.", a: "고혈압, 당뇨, 고지혈증, 흡연, 음주 등" },
    { q: "37세 여자가 diplopia와 ptosis를 주소로 내원하였다. 약 1년 전부터 간헐적으로 발생했으며 주로 아침에 일어날 때는 이상 없는데 회사에서 퇴근할 무렵에는 증상이 심해진다고 했다. 안구 증상과 함께 최근에는 옷 입기 힘들 정도로 근력저하가 발생했으며 마찬가지로 오후로 갈수록 증상이 심해졌다. 환자에 대해서 반복신경자극검사에서 4-5번째 CAMP(복합근활동전위)가 첫 번째에 비해 10%이상 감소하였으며, 항콜린에스테라아제검사 했을 때 20분경에 증상호전을 확인하였다. <br>위 환자의 가장 의심되는 진단명을 쓰시고, 추가로 시행가능한 진단법을 아는 대로 쓰시오. 또, 위 질환의 치료법을 아는 대로 쓰시오(crisis 때 치료 포함).", a: "진단명 : MG(Myasthenia gravis) <br>진단법 : RNS test, Tensilon test, single fiber EMG, Prolonged upgaze test, serology(Ab test), Ice cube test <br>치료: Anti-cholinesterase drug, immunosuppressive drug (cyclosporine, MMF), thymectomy <br>Crisis 때는 plasmapheresis, IVIG" },
    { q: "54세 남자환자가 dizziness를 주소로 증상 발생 후 3시간만에 응급실로 내원하였다. 환자는 HTN으로 진단받아 med. 복용하고 있었으며 20갑년의 흡연력이 있었다. 신경학적 진찰 상 ipsipulsion과 nystagmus가 있었으며, Rt. side V1-3 region에 감각 저하 및 동측 Honer syndrome 확인되었다. 환자는 말할 때 쉰목소리가 나온다고 했으며, 응급실 내원 후 약을 먹기 위해 물을 마실 때 심하게 사래에 걸렸다. 또한 가만히 앉아있어도 오른쪽으로 기우는 증상이 발생했으며, Rt. side severe dysmetria 관찰되었다. 또한 점점 왼쪽 상하지 온도, 통증 감각이 저하되는 것 같다고 했다. 현재 환자의 신경학적 진찰을 토대로 가장 가능성 있는 진단명을 쓰고, 어떤 혈관에 문제가 생겼을 지와 기시하는 혈관을 쓰시오. 또, Rt. side V1-3 region에 감각 저하 증상/쉰목소리&사래 증상과 연관된 신경 해부학적 구조물을 각각 쓰시오.", a: "진단명: Rt. Lateral medullary syndrome <br>혈관: Rt. PICA(Posterior Inferior cerebellar artery) <br>기시하는 혈관: vertebral artery <br>Rt. Side V1-3 region에 감각 저하: descending trigeminal sensory tract <br>쉰목소리, 삼킴 곤란: Nucleus ambiguus <br><img src='9.png' style='max-width:600px;'>" },
    { q: "56세 남자가 지속되는 Lt. foot drop을 주소로 신경과 협진의뢰 되었다. 3주 전에 3-vessels disease에 대해 약 10시간에 걸친 by-pass 수술을 받았다. 수술 후 마취에서 깰 때 환자는 Lt. ankle dorsiflexion과 toe extension의 어려움을 겼었고 Lt. foot dorsum에 pin-and-needle sensation이 있었다. 이후 환자는 걸을 때 Lt. foot이 바닥에 끌리는 현상이 있다고 했으나 Rt. side는 intact 하였다. 해당 환자의 신경학적 진찰 상 lower extremity의 muscle tone과 bulk는 양측 모두 대칭이었으며 이상 없었고, Lt. side ankle & toe의 dorsiflexion 은 motor grade 2로 측정되었다. 또한 ankle eversion도 grade 3정도로 약화되었다. 그 밖에 Lt. side lower extremity의 motor는 정상적이었으며 DTR 도 정상적이고, pathologic reflexes 도 관찰되지 않았다. <br>다음 물음에 답하시오. <br>1) 가장 의심되는 진단명을 쓰시고, 만약 이 환자에서 knee flexion, foot inversion까지도 문제가 생겼을 경우 가능한 병변(nerve이름)을 쓰시오. <br>2) 환자의 dorsum 부위의 paresthenia와 eversion 장애는 어떤 nerve의 이상인지 쓰고, 그 nerve가 innervation하는 muscle 하나를 쓰시오. <br>3) 각각 신경의 이름을 쓰시고 ankle dorsiflexion에 문제를 일으켰을 만한 신경을 아래에서 고르고, 그 신경이 지배하는 근육을 최소 하나 쓰시오 (하나만 써도 인정).<br><img src='11.png' style='max-width:600px;'>", a: "1) Lt. common peroneal neuropathy, knee flexion: sciatic never, foot inversion: tibial nerve <br>2) Superficial peroneal nerve, peroneus longus muscle <br>3) 1: common peroneal nerve, 2: deep peroneal nerve, 3: superficial peroneal nerve <br>문제신경: deep peroneal nerve, 지배근육: tibialis anterior" },
    { q: "56세 여자환자가 갑자기 발생한 어지럼증을 주소로 내원하였다. 증상은 자세에 따라 변화가 없었고, 수 시간 동안 지속되었다. 동반된 증상으로 오심, 구토가 있었다. 살면서 이런 어지러움은 처음이라고 하였다. 4일 전에 감기 기운이 있어서 근처 내과에서 약을 타 먹었던 적이 있었다고 했다. <br>신경학적 진찰 시, right으로 수평성분 nystagmus가 all position에서 관찰되었으며, Alexander’s law를 만족하였다. 그 밖에 청력저하 등 ear symptom은 없었다. <br>이 환자에서 가장 의심되는 진단명 한 개를 쓰고 감별해야하는 질환 두 가지를 쓰시오. 또 peripheral dizziness와 central dizziness의 차이점을 2개 이상 쓰시오.", a: "진단명: vestibular neuritis <br>감별질환: BPPV, Meniere disease <br>Peripheral dizziness와 central dizziness의 차이점 <br><img src='10.png' style='max-width:600px;'>" },
    { q: "73세 남자가 2시간 전에 발생한 dizziness를 주소로 본원 응급실 내원하였다. 과거력으로는 HTN, 20갑년의 흡연력 있었으며, 이전에 Acute infarction in Lt. subcortex로 진단받아 본원 신경과 입원치료 받은 적 있었다. <br>환자분 신경학적 진찰을 했을 때 아래와 같은 안구 움직임이 관찰되었다. 해당 안구 움직임을 나타낼 수 있는 질환명을 쓰고 병터를 아래 그림에서 고르고 그 이름을 쓰시오. <br><img src='12.png' style='max-width:600px;'><br><img src='13.png' style='max-width:600px;'>", a: "질환명: one and a half syndrome <br>병터 5: Lt. MLF, nucleus abducens" },
    { q: "34세 여자가 Lt. visual disturbance를 주소로 응급실에 내원하였다. 위 증상은 약 1달 전부터 서서히 시작되었다. 시력이상과 함께 이전처럼 색깔 구분도 잘 되지 않는다고 하며 왼쪽 눈을 눌렀을 때 pain을 호소하였다. 안구통증이나 시야증상은 뜨거운 물에 목욕을 했을 때 더 심해진다고 했다. <br>약 1년 전에는 오른쪽 속 끝에 저런 느낌이 약 1주일 정도 지속되었다가 호전되었다고 했으며, 고개를 아래로 숙였을 때 등을 타고 아래로 뻗치는 찌릿한 느낌이 동반되었다고 한다. 현재도 해당 증상은 조금 남아 있다고 했다. 그 외 신경학적 진찰 상 특이 소견은 관찰되지 않았다. <br>응급실 내원 후 촬영한 MRI 상 아래와 같은 소견이 확인되었다. 다음 물음에 답하시오. <br><img src='14.png' style='max-width:600px;'><br>1) 가장 의심되는 질환명과 이와 감별해야 하는 질환을 2개 이상 쓰시오. <br>2) 위 질환의 진단기준 중 MRI 상 나타날 수 있는 병변 4가지를 쓰시오.", a: "1) 의심되는 질환명: MS, 감별질환: NMO, ADEM <br>2)병변 4가지: periventricular lesion, juxtacortical lesion, infratentorial lesion, spinal cord"  },
    { q: "65세 남자 환자가 4개월 전부터 나타난 손떨림 및 보행 장애를 주소로 내원하였다. 증상은 서서히 나타났으며 지속적인 양상을 보였다. 손떨림은 주로 오른손에서 나타났으며, 가만히 있을 때도 나타난다고 하였다(5Hz). 비슷한 시기부터 걸을 때, 오른쪽 다리가 끌리는 듯한 느낌이 들었으며, 움직임이 이전보다는 약간 느려진 것 같다고 한다. 인지 기능의 장애는 호소하지 않았고, 배뇨 장애나 발기 부전은 없었으며, 기립 시 어지럼증도 없었다. 오른팔에서 cogwheel rigidity가 grade 2정도로 측정되었고, 소뇌 기능검사에서 실조증은 없었으며 건반사도 정상이었다. 과거 병력에서 특이 사항은 없었으며, 복용 중인 약물도 없었다. 1년 전 사무직에서 퇴직하였으며, 술은 한 달에 2회 정도 소주 1병/회, 담배는 5년 전에 끊었다고 한다. 내원 후 시행한 brain MRI에서 특이소견 관찰되지 않았다. <br>1) 상기 환자의 가장 적절한 진단명을 하나 쓰시고, 치료를 아는 대로 쓰시오(하나만 써도 인정). 해당 질환의 핵심증상 3가지를 쓰시오. <br>2) 치매의 정의를 쓰고 치매 약물 종류 2가지 이상을 쓰시오.", a: "1) 진단명: Parkinson's disease, 치료: levodopa, dopamine agonist, 핵심증상: bradykinesia, rigidity, resting tremor <br>2) 정의: 인지장애와 인지장애로 인한 일상생활의 장애, 약물: Acetylcholinesterase inhibitor, Choline agonist, NMDA receptor antagonist " },
    { q: "50세 여자환자가 5일 전부터 신호등의 붉은 색, 녹색이 구별되지 않고 횡단보도의 가로줄이 뿌옇게 보이기 시작했다. 증상은 이후 점점 더 심해지고 왼쪽 눈으로 볼 때는 평소와 같은데 오른쪽 눈은 위 증상들과 통증이 동반되었다. 시력은 우측 0.1, 좌측 1.0으로 측정되었고 우측 눈의 색각이상이 관찰되었다. 신경학적 진찰 상 isocoric pupil이었으나 우측의 동공반사가 감소되고, RAPD가 관찰되었다. 대면검사를 통해 시야검사에서는 우측 눈의 아래 수평결손(inferior altitudinal defect)이 의심되었다. 안저검진 상 우측에 optic disc margin의 blurring이 관찰되었다. 그 외 신경학적 이상소견은 없었다. <br>이 환자의 의심되는 진단명을 쓰고, 그 치료법을 적으시오. 또, 이 질환과 감별해야 할 질환병과 감별 포인트를 쓰시오. <br><img src='15.png' style='max-width:600px;'>", a: "진단명: optic neuritis, 치료법: steroid IV <br><img src='19.png' style='max-width:600px;'>" },
    { q: "35세 남자 환자가 mental change with fever(38.6도 측정)를 주소로 본원 응급실로 내원하였다. 환자는 내원 약 일주일 전부터 감기로 local병원에서 치료를 받았으며 3일 전부터 머리가 아프다고 호소하였다고 한다. 환자는 강한 자극을 줬을 때 겨우 눈을 뜰 수 있었으며, pain을 주면 localization 할 수 있었고 물을 때 inappropriate word를 말하였다. Pathologic reflex 보이지 않았고, DTR 항진소견 보이지 않았다. <br>양안 pupil 정상이었으며, light reflex도 양쪽 정상이었다. Meningeal irritation sign check 했을 때, neck stiffness 확인 되었다. <br>Initial brain CT 상에서 hemorrhage는 보이지 않았다. CSF study 상 opening pressure 250mmH2O 측정되었고, CSF 색은 turbid한 yellowish color였다. Glucose ratio는 0.40로 측정되었고, Cell count 상 WBC 1050/mm2, Neutrophil 98%, Lymphocyte 2%로, protein 205mg/dl로 측정되었다. <br>다음 물음에 답하시오. <br>1) 위 환자의 mentality를 평가하고 가장 의심되는 진단명을 쓰시오. GCS scoring을 하시오. <br>2) 위 환자에 대한 치료를 아는 대로 쓰시오.", a: "1) Stupor, Bacterial meningoencephalitis, GCS(2/3/5) <br>2) 3세대 cephalosporin, IV vancomycin" },
    { q: "73세 남자가 2시간 전에 발생한 dizziness를 주소로 본원 응급실 내원하였다. 과거력으로는 HTN, 20갑년의 흡연력 있었으며, 이전에 Acute infarction in Lt. subcortex로 진단받아 본원 신경과 입원치료 받은 적 있었다. <br>환자분 신경학적 진찰을 했을 때 아래와 같은 안구 움직임이 관찰되었다. 해당 안구 움직임을 나타낼 수 있는 질환명을 쓰고 병터를 아래 그림에서 고르고 원인 두가지를 쓰시오. <br><img src='16.png' style='max-width:600px;'>", a: "질환명: Rt. oculomotor palsy, 원인: trauma, microvascular ischemia <br><img src='17.png' style='max-width:600px;'>" },
    { q: "35세 남자 환자가 mental change with fever(38.6도 측정)를 주소로 본원 응급실로 내원하였다. 환자는 내원 약 일주일 전부터 감기로 local병원에서 치료를 받았으며 3일 전부터 머리가 아프다고 호소하였다고 한다. 환자는 강한 자극을 줬을 때 겨우 눈을 뜰 수 있었으며, pain을 주면 localization 할 수 있었고 물을 때 inappropriate word를 말하였다. Pathologic reflex 보이지 않았고, DTR 항진소견 보이지 않았다. <br>양안 pupil 정상이었으며, light reflex도 양쪽 정상이었다. Meningeal irritation sign check 했을 때, neck stiffness 확인 되었다. <br>Initial brain CT 상에서 hemorrhage는 보이지 않았다. CSF study 상 opening pressure 250mmH2O 측정되었고, CSF 색은 clear한 yellowish color였다. Glucose ratio는 0.50로 측정되었고, Cell count 상 WBC 1050/mm2, Neutrophil 37%, Lymphocyte 63%로, protein 205mg/dl로 측정되었다. <br>다음 물음에 답하시오. <br>1) 위 환자의 mentality를 평가하고 가장 의심되는 진단명을 쓰시오. GCS scoring을 하시오. <br>2) 위 환자에 대한 치료를 아는 대로 쓰시오.", a: "1) stupor, viral meningoencephalitis, GCS(2/3/5) <br>2) 대증치료, acyclovir" },
    { q: "Parkinsonism을 나타내는 질환 중 Neuroleptic hypersensitivity를 보이는 대표적인 질환을 쓰시오.", a: "Dementia with Lewy Bodies (DLB)" },
    { q: "PNES(psychogenic non epileptic seizure)와 epilepsy의 차이점을 3가지 이상 쓰시오.", a: "<img src='18.png' style='max-width:600px;'>" },
    { q: "TB encephalitis 의 MRI finding에 대해 쓰시오.", a: "뇌 기저막의 강한 조영증강과 혈관염에 의한 국소적 경색이 흔히 관찰되며, 주로 교통성 수두증이 동반" },
    { q: "Herpes encephalitis patient의 Brain MRI 영상소견에서 주로 침범되는 부위는?", a: "temporal lobe(측두엽) ; medial temporal lobe 이 주로 침범됨, inferior frontal lobe(전두엽 하부)" },
    { q: "57세 여자가 headache를 주소로 신경과 외래에 내원하였다. 환자가 호소하는 두통은 일주일 중 거의 5일 동안 발생하였으며, 심할 때는 하루 종일 아프기도 한다고 했다. 심할 때 약을 먹으면 조금 호전되기도 하지만 다시 악화된다고 했다. <br>주로 왼쪽 fronto-temporal area에 통증이 있었으며 심장박동 주기처럼 박동성의 욱씬거리는 통증이 있었다. 통증 위치는 여기저기 돌아다니기도 한다. 가장 심할 때 통증 강도는 VAS 7-8점 정도이다. 통증이 너무 심할 때는 아무 일도 할 수 없을 정도여서 누워만 있을 정도라고 했다. 특히나 큰 소리가 나거나 밝은 빛을 보면 더 심해져서 문을 다 닫고 커튼도 쳐놓고 가만히 누워 있어야 한다고 했다. 두통 시작 전에 눈앞에 어른거리는 증상이나 번쩍거림은 없었다고 한다. <br>다음 물음에 답하시오. <br>위 환자의 진단명을 쓰시고, 치료법을 아는대로 쓰시오.", a: "진단명: migraine headache without aura <br>치료법 <br>예방: beta-blocker, CCB, 급성기: NSAIDs, 만성: 보톡스" },
    { q: "77세 남자 환자가 응급실에 의식저하를 주소로 내원하였습니다. 약 3시간 전 발작 후 의식이 혼미하여 응급실로 내원하였다. 이전에 in car TA로 Rt. Frontal area hemorrhage가있어서 이에 대한 수술적 처치를 시행한 기왕력이 있다. 상기 환자 응급실 내원 후 한 차례 비유발 발작을 하여 IV lorazepam 4mg 투약하였다. 이 후 응급실 내원 후 시행한 brain CT상에서 Rt. Frontal area에 cortical defect를 포함한 lesion이 있었고, 그 외 lab 검사 결과 정상적이었다. 또한 acute storke 및 다른 CNS infection 배제되었다. <br>다음 환자의 진단명을 쓰고, 진단 기준 및 할 수 있는 치료법에 대해 쓰시오.", a: "진단명: epilepsy <br>진단 기준 1) 24시간 이상 간격으로 unprovoked seizure가 2회 이상 발생한 경우 2) 1회의 unprovoked seizure가 발생했고 향후 10년 이내에 unprovoked seizure의 발생가능성이 60%를 넘는 경우 <br>치료법: AED(anti-epileptic drug)" },
    { q: "Horner syndrome의 세 가지 증상을 쓰고, 해당 증상은 어떤 신경에 이상이 생겼을 때 발생하는지 쓰시오.", a: "ptosis, miosis, anhidrosis <br>Descending sympathetic nerve fiber(tract)" },
    { q: "56세 여자환자가 갑자기 발생한 어지럼증을 주소로 내원하였다. 증상은 자세에 따라 변화가 없었고 수 시간 동안 지속되었다. 동반된 증상으로 오심, 구토가 있었고 상기증상은 이전에도 한 번 있어서 응급실 방문한 적 있다고 하였다. 가만히 있으면 안진이 발생하지 않았으나, Rt. Dix hallpike 시 특정 안진이 유발되었으며, 다시 앉게 하면 하향, 반시계방향 안진이 유발되었다. <br>위 질환 진단명을 쓰시오. 또, Rt. Dix-hallpike시 환자에서 보일 수 있는 안진과 할 수 있는 치료방법(maneuver)을 쓰시오.", a: "진단명: Rt. PC. BPPV <br>Rt. Dix-hallpike시 보일 수 있는 안진: UBN, CW <br>치료방법: Epley maneuver" },
    { q: "44세 남자가 행동변화를 주소로 응급실에 내원하였다. 환자는 최근 1달 동안 식사를 거의 하지 않고 술만 마셨다. 환자는 의사소통은 가능하였지만, 주위에 대한 반응이 느린 상태였으며 움직이려고 하지 않는 모습을 보였다. <br>시행한 MMSE 검사는 24점으로 저하되어 있었고 cranial nerve examination 상에서 주시유발안진(GEN) 관찰되었다. 사지 근력 강도는 Grade 4+ 정도로 가벼운 정도의 전반적인 위약감이 있었으며, 감각 검사, 심부건반사는 정상이었다. 소뇌기능검사에서 finger to nose, heel to shin을 시행했을 때 모두 실조를 나타내었으며, 보행 불안정성이 심하여 스스로 걷지 못하였다. <br>상기 환자의 적절한 진단명과 치료를 쓰시오.", a: "Wernicke encephalopathy, Vit. B1(티아민) 보충" },
    { q: "65세 남자환자가 보행장애를 주소로 내원하였다. 증상은 2년 전부터 서서히 발생했으며 걸을 때 오른손을 덜 흔든다는 이야기를 들었다. 식사를 할 때 오른손 떨림이 동반된다고 호소하였다. 이 환자에서 Parkinson plus를 시사하는 소견을 모두 고르시오. <br>1)Resting tremor 2)Rigidity 3)Postural instability 4)Bradykinesia 5)Freezing of gait", a: "3) postural instability, 5) freezing of gait" },
    { q: "Dawson's finger란?", a: "Dawson's fingers are a specific MRI finding in the brain, characterized by finger-like projections extending from the ventricles, often associated with multiple sclerosis (MS)." },
    { q: "NMOSD에서 특징적인 소견과 항체는?", a: "시신경척수염의 특징적인 소견은 시신경염과 횡단척수염이 동시에 또는 수주 간격을 두고 발생하는 것입니다. 이러한 증상으로 인해 시력 저하, 운동 기능 장애, 감각 이상 등이 나타날 수 있습니다. 주요 원인 항체는 항아쿠아포린-4 항체(anti-aquaporin-4 antibody, AQP4-Ab)이며, 이 항체가 발견되는 환자에서 시신경척수염이 발병할 가능성이 높습니다." }
  ];

  const KEY = {
    WRONG: 'quiz_wrong_v1',
    MODE: 'quiz_mode_v1',
    NORMAL_ORDER: 'quiz_normal_order_v1',
    NORMAL_IDX: 'quiz_normal_idx_v1',
    REVIEW_ORDER: 'quiz_review_order_v1',
    REVIEW_IDX: 'quiz_review_idx_v1'
  };

  let wrongList = JSON.parse(localStorage.getItem(KEY.WRONG) || '[]');
  let mode = localStorage.getItem(KEY.MODE) || 'normal';
  let orderNormal = JSON.parse(localStorage.getItem(KEY.NORMAL_ORDER) || 'null');
  let idxNormal = parseInt(localStorage.getItem(KEY.NORMAL_IDX) || '0', 10);
  let orderReview = JSON.parse(localStorage.getItem(KEY.REVIEW_ORDER) || 'null');
  let idxReview = parseInt(localStorage.getItem(KEY.REVIEW_IDX) || '0', 10);

  const elStatus = document.getElementById('status');
  const elQuestion = document.getElementById('question');
  const elAnswer = document.getElementById('answer');
  const elBtnShow = document.getElementById('btnShowAnswer');
  const elBtnWrong = document.getElementById('btnMarkWrong');
  const elBtnNext = document.getElementById('btnNext');
  const elBtnPrev = document.getElementById('btnPrev');
  const elBtnToggle = document.getElementById('btnToggleMode');
  const elBtnReset = document.getElementById('btnReset');
  const elProgressInfo = document.getElementById('progressInfo');
  const elProgressInner = document.getElementById('progressInner');
  const elBtnRestartReview = document.getElementById('btnRestartReview');
  const elBtnRemoveWrong = document.getElementById('btnRemoveWrong');

  function shuffledArray(n){
    const arr = Array.from({length:n}, (_,i)=>i);
    for(let i=arr.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [arr[i],arr[j]]=[arr[j],arr[i]];
    }
    return arr;
  }

  function saveAll(){
    localStorage.setItem(KEY.WRONG, JSON.stringify(wrongList));
    localStorage.setItem(KEY.MODE, mode);
    if(orderNormal) localStorage.setItem(KEY.NORMAL_ORDER, JSON.stringify(orderNormal));
    localStorage.setItem(KEY.NORMAL_IDX, idxNormal);
    if(orderReview) localStorage.setItem(KEY.REVIEW_ORDER, JSON.stringify(orderReview));
    localStorage.setItem(KEY.REVIEW_IDX, idxReview);
  }

  function clearAll(){
    localStorage.removeItem(KEY.WRONG);
    localStorage.removeItem(KEY.MODE);
    localStorage.removeItem(KEY.NORMAL_ORDER);
    localStorage.removeItem(KEY.NORMAL_IDX);
    localStorage.removeItem(KEY.REVIEW_ORDER);
    localStorage.removeItem(KEY.REVIEW_IDX);
    wrongList = [];
    mode = 'normal';
    orderNormal=null; orderReview=null;
    idxNormal=0; idxReview=0;
  }

  function ensureOrders(skipShuffle=false){
    // 일반 모드 문제 순서
    if(!orderNormal || !Array.isArray(orderNormal) || orderNormal.length !== questions.length){
      orderNormal = shuffledArray(questions.length);
      idxNormal = Math.min(Math.max(0, idxNormal), Math.max(0, orderNormal.length-1));
    }

    // 복습 모드 문제 순서
    if(!orderReview || !Array.isArray(orderReview) || orderReview.length !== wrongList.length){
      if(!skipShuffle){  // ← true면 섞지 않음
          orderReview = shuffledArray(wrongList.length);
      }
      idxReview = Math.min(Math.max(0, idxReview), Math.max(0, wrongList.length-1));
    } else {
      idxReview = Math.min(Math.max(0, idxReview), Math.max(0, wrongList.length-1));
    }
}

  function currentListAndIndex(){
    if(mode==='normal'){
      return {listType:'normal', order:orderNormal, idx:idxNormal, total:orderNormal.length};
    } else {
      return {listType:'review', order:orderReview, idx:idxReview, total:orderReview.length};
    }
  }

  function getCurrentQuestion(){
    const info = currentListAndIndex();
    if(info.total===0) return null;
    if(info.listType==='normal'){
      return questions[info.order[info.idx]];
    } else {
      return wrongList[info.order[info.idx]];
    }
  }

  function updateProgressBar(idx,total,percent){
    elProgressInfo.innerText=`진행: ${idx}/${total}  (${percent}%)`;
    elProgressInner.style.width=total===0?'0%':`${percent}%`;
  }

  function updateToggleText(){
    elBtnToggle.textContent = mode==='normal'?`복습 모드 (${wrongList.length})`:'일반 모드로';
  }

  function render(){
    ensureOrders();
    saveAll();
    const info=currentListAndIndex();

    // 버튼 표시
    if(mode==='review' && info.total>0){
      elBtnRestartReview.style.display='inline-block';
      elBtnRemoveWrong.style.display='inline-block';
    } else {
      elBtnRestartReview.style.display='none';
      elBtnRemoveWrong.style.display='none';
    }

    if(info.total===0){
      elStatus.innerText = mode==='normal'?'문제가 비어있습니다. questions 배열을 채워주세요.':'복습할 문제가 없습니다.';
      elQuestion.innerText = mode==='normal'?'문제가 없습니다.':'복습할 문제가 없습니다.';
      elAnswer.style.display='none';
      updateProgressBar(0,info.total,0);
      updateToggleText();
      return;
    }

    // 완료 상태 반영 (추가: 복습 모드도 진행률 끝까지)
    if(info.idx >= info.total){
      elQuestion.innerText='모든 문제가 완료되었습니다.';
      elAnswer.style.display='none';
      updateProgressBar(info.total, info.total, 100);
      updateToggleText();
      return;
    }

    const cur = getCurrentQuestion();
    if(!cur){
      elQuestion.innerText='문제가 없습니다.';
      elAnswer.style.display='none';
      updateProgressBar(info.idx,info.total,Math.round((info.idx/Math.max(1,info.total))*100));
      updateToggleText();
      return;
    }

    elQuestion.innerHTML = cur.q;
    elAnswer.innerHTML = cur.a;
    elAnswer.style.display='none';

    const currentNumber=info.idx+1;
    const remaining=Math.max(0,info.total-info.idx-1);
    elStatus.innerText=`모드: ${mode==='normal'?'일반':'복습'}  •  ${currentNumber} / ${info.total}  (남음: ${remaining})`;
    updateProgressBar(info.idx, info.total, Math.round((info.idx/Math.max(1,info.total))*100));
    updateToggleText();
  }

  function showAnswer(){
    const cur = getCurrentQuestion();
    if(!cur) return;
    elAnswer.style.display='block';
  }

  function markWrong(){
    const info=currentListAndIndex();
    if(info.total===0 || info.idx>=info.total) return;
    const cur=getCurrentQuestion();
    if(!cur) return;
    if(!wrongList.some(it=>it.q===cur.q && it.a===cur.a)){
      wrongList.push({q:cur.q,a:cur.a});
      orderReview=shuffledArray(wrongList.length);
      idxReview=Math.min(idxReview, orderReview.length-1);
      saveAll();
      updateToggleText();
    }
  }

  function removeWrong(){
    const cur = getCurrentQuestion();
    if(!cur) return;
    if(removeFromWrongListByQA(cur.q,cur.a)){
        ensureOrders(true);  // ← 여기서 셔플 방지
        if(idxReview >= wrongList.length) idxReview = Math.max(0, wrongList.length-1);
        saveAll();
        render();
    }
}

  function nextQuestion(){
    const info=currentListAndIndex();
    if(info.total===0){ render(); return; }
    if(info.listType==='normal'){
      idxNormal++;
      if(idxNormal>info.total) idxNormal=info.total;
    } else {
      idxReview++;
      if(idxReview>info.total) idxReview=info.total;
    }
    saveAll();
    render();
  }

  function prevQuestion(){
    const info=currentListAndIndex();
    if(info.total===0){ render(); return; }
    if(info.listType==='normal'){
      if(idxNormal<=0) return;
      idxNormal = Math.max(0, idxNormal-1);
      const prev = questions[orderNormal[idxNormal]];
      if(prev) removeFromWrongListByQA(prev.q,prev.a);
    } else {
      if(idxReview<=0) return;
      idxReview=Math.max(0, idxReview-1);
    }
    saveAll();
    render();
  }

  function removeFromWrongListByQA(q,a){
    const i = wrongList.findIndex(it => it.q === q && it.a === a);
    if(i !== -1){
        wrongList.splice(i, 1);  // 오답 제거

        // ↓ 여기서 셔플하지 않음 → 기존 순서 유지
        // orderReview = shuffledArray(wrongList.length);

        // 현재 인덱스 조정
        if(idxReview >= wrongList.length){
            idxReview = Math.max(0, wrongList.length - 1);
        }

        // 오답이 다 사라지면 일반 모드로
        if(mode === 'review' && wrongList.length === 0){
            mode = 'normal';
            localStorage.setItem(KEY.MODE, mode);
        }

        saveAll();
        updateToggleText();
        return true;
    }
    return false;
}


  function restartReview(){
    idxReview=0;
    saveAll();
    render();
  }

  function toggleMode(){
    mode = (mode==='normal')?'review':'normal';
    localStorage.setItem(KEY.MODE, mode);
    if(mode==='review' && wrongList.length===0){
      alert('복습할 오답이 없습니다.');
      mode='normal';
      localStorage.setItem(KEY.MODE, mode);
      return;
    }
    ensureOrders();
    render();
  }

  function resetProgress(){
    if(!confirm('진행 상황(섞인 순서 및 인덱스)과 오답 목록을 초기화할까요?')) return;
    clearAll();
    ensureOrders();
    saveAll();
    render();
  }

  elBtnShow.addEventListener('click', showAnswer);
  elBtnWrong.addEventListener('click', markWrong);
  elBtnNext.addEventListener('click', nextQuestion);
  elBtnPrev.addEventListener('click', prevQuestion);
  elBtnToggle.addEventListener('click', toggleMode);
  elBtnReset.addEventListener('click', resetProgress);
  elBtnRestartReview.addEventListener('click', restartReview);
  elBtnRemoveWrong.addEventListener('click', removeWrong);

  if('serviceWorker' in navigator){
    window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js?v=5').catch(e=>{console.warn('ServiceWorker 등록 실패:',e);});});
  }

  ensureOrders();
  render();
</script>
</body>
</html>
